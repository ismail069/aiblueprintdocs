<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized blueprint recovery screen</title><desc id="desc">A mock paused-process notice with retry and support options.</desc>
  <rect width="1200" height="560" rx="28" fill="#F3F6FD"/><rect x="255" y="62" width="690" height="436" rx="22" fill="#fff" stroke="#C9D5F4"/>
  <circle cx="326" cy="137" r="28" fill="#FFF1D6"/><text x="316" y="147" font-family="Arial" font-weight="700" font-size="27" fill="#C67600">!</text><rect x="371" y="118" width="162" height="34" rx="17" fill="#FFF1D6"/><text x="397" y="141" font-family="Arial" font-weight="700" font-size="14" fill="#9B5B00">PROCESS PAUSED</text>
  <text x="305" y="211" font-family="Arial" font-weight="700" font-size="30" fill="#10254C">The Blueprint is not complete yet</text><text x="305" y="251" font-family="Arial" font-size="17" fill="#64759A">Completed stages remain saved. Do not create a duplicate project.</text>
  <rect x="305" y="285" width="590" height="74" rx="14" fill="#F8FAFF" stroke="#D7DFF2"/><text x="329" y="315" font-family="Arial" font-size="14" fill="#7584A2">SUPPORT ID</text><text x="329" y="342" font-family="monospace" font-size="17" fill="#10254C">example-support-id</text>
  <rect x="305" y="394" width="158" height="52" rx="12" fill="#EEF3FF" stroke="#AFC0EE"/><text x="358" y="427" font-family="Arial" font-weight="700" font-size="16" fill="#2D5BDF">Retry</text><rect x="485" y="394" width="246" height="52" rx="12" fill="#2D5BDF"/><text x="540" y="427" font-family="Arial" font-weight="700" font-size="16" fill="#fff">Open Support</text><rect x="753" y="394" width="142" height="52" rx="12" fill="#fff" stroke="#AFC0EE"/><text x="781" y="427" font-family="Arial" font-weight="700" font-size="16" fill="#34496F">My Blueprints</text>
</svg>
